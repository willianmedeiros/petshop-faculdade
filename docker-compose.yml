version: '3.8'

services:
  web:
    build: .
    container_name: petshop_web
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - petshop_net

  db:
    image: mysql:8.0
    container_name: petshop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petshop
      MYSQL_USER: petshop_user
      MYSQL_PASSWORD: petshop_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - petshop_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: petshop_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db
    networks:
      - petshop_net

networks:
  petshop_net:

volumes:
  db_data:
